name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both offline deliverables are generated from src/. Check their exact bytes
# and exercise the companion plus the multi-character narrative runtime.
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          # The documented floor, so a new toolchain release cannot break the build.
          python-version: '3.9'

      - name: HTML and SDK match the modular source
        run: python3 tools/build.py --check

      - name: Theme packs and curated vocabulary match their sources
        run: |
          node tools/build-themes.cjs --check
          node tools/extend-artifact.cjs --check

      - name: Rebuilding does not change the committed files
        run: |
          python3 tools/build.py
          git diff --exit-code -- Kira.html KiraSDK.js

      - name: Companion and narrative SDK regression tests
        run: npm test

      - name: Release packaging failure paths and reproducibility
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  android:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4

      - name: Install the pinned Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Android lint, export persistence tests, APK, and App Bundle
        working-directory: android
        run: ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease bundleRelease

      - name: Package and verify all distributions
        run: |
          python3 tools/package-release.py
          cd dist
          sha256sum --check SHA256SUMS

      # CI uses an ephemeral debug signing key. Official upgrade-compatible
      # releases must be built with the maintained signing key, then published separately.
      - name: Retain reviewable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kira-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Retain Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
