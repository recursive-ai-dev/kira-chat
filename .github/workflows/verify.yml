name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Both offline deliverables are generated from src/. Check their exact bytes
# and exercise the companion plus the multi-character narrative runtime.
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          # The documented floor, so a new toolchain release cannot break the build.
          python-version: '3.9'

      - name: HTML and SDK match the modular source
        run: python3 tools/build.py --check

      - name: Theme packs and curated vocabulary match their sources
        run: |
          node tools/build-themes.cjs --check
          node tools/extend-artifact.cjs --check

      - name: Rebuilding does not change the committed files
        run: |
          python3 tools/build.py
          git diff --exit-code -- Kira.html KiraSDK.js

      - name: Companion and narrative SDK regression tests
        run: npm test
